<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        (async () => {
            const code = new URLSearchParams(window.location.search).get('code');
            if (!code) {
                document.body.innerHTML = '<p style="text-align:center;padding:40px">Error: No shortcode provided</p>';
                return;
            }
            
            try {
                const res = await fetch(`https://tfnsulqqfzkmefdhgoyi.supabase.co/rest/v1/shortlinks?code=eq.${code}&select=full_url`, {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmbnN1bHFxZnprbWVmZGhnb3lpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NzEwNDEsImV4cCI6MjEwNDQ5MTA0MX0.ZkD3CtUJC51SoXSkMEPFh0WW8NHzV-MACezOH4Zk0Nw'
                    }
                });
                
                const data = await res.json();
                if (data && data.length > 0 && data[0].full_url) {
                    window.location.href = data[0].full_url;
                } else {
                    document.body.innerHTML = '<p style="text-align:center;padding:40px">Error: Shortcode not found</p>';
                }
            } catch (e) {
                document.body.innerHTML = `<p style="text-align:center;padding:40px">Error: ${e.message}</p>`;
            }
        })();
    </script>
</head>
<body style="text-align: center; font-family: Arial; padding: 40px;">
    <p>Redirecting...</p>
</body>
</html>
