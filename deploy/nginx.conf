server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Blokir file tersembunyi & sensitif (lapisan kedua, file sudah dihapus saat build)
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(php|db|db-shm|db-wal|sql|md|env|lock|log)$ { deny all; }

    # CMS React SPA di /admin (sama seperti .htaccess lama)
    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Shortlink /s/slug -> ditangani index.html
    location ~ ^/s/[a-z0-9-]+/?$ {
        try_files $uri /index.html;
    }

    # /about.html -> /about (redirect permanen)
    location ~ ^/(?<page>.+)\.html$ {
        if ($request_uri ~* "\.html(\?|$)") {
            return 301 /$page$is_args$args;
        }
    }

    # Clean URL: /about -> about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache aset statis
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
