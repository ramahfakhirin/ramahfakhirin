<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=/">
    <title>Redirecting...</title>
</head>
<body>
    <p>Redirecting... if not working, <a href="/">click here</a></p>
    <script>
        const code = new URLSearchParams(window.location.search).get('code');
        if (code) {
            fetch(`/api/shortlink.php?code=${code}`)
                .catch(() => window.location.href = '/');
        }
    </script>
</body>
</html>
